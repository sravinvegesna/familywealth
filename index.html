/* ═══════════════════════════ FamilyWealth — Full Redesign ═══════════════════════════
   Inspired by: soft purple/lavender finance app
   Aesthetic: cute-professional, bubbly, pastel gradients, playful but data-rich
   Rules: NO CSS vars, all hex hardcoded, iOS Safari safe, max-width 430px
   ═══════════════════════════════════════════════════════════════════════════════════ */

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{color-scheme:light;}
html,body{height:100%;overflow:hidden;background:#F0EDFF !important;color:#1A1040 !important;}
body{font-family:‘DM Sans’,sans-serif;color:#1A1040;-webkit-overflow-scrolling:touch;}
#root{height:100%;display:flex;flex-direction:column;background:#F0EDFF;}

/* ── SPLASH ── */
#splash{position:fixed;inset:0;background:linear-gradient(160deg,#7B5EA7 0%,#9B6FD4 50%,#B48FE8 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.6s ease;}
#splash.hide{opacity:0;pointer-events:none;}
.splash-pig{font-size:64px;animation:pigpop 1s cubic-bezier(0.34,1.56,0.64,1) forwards;opacity:0;}
@keyframes pigpop{0%{opacity:0;transform:scale(0.4) translateY(20px);}100%{opacity:1;transform:scale(1) translateY(0);}}
.splash-name{margin-top:20px;font-size:30px;font-weight:300;color:#FFF;letter-spacing:-0.3px;}
.splash-name strong{font-weight:800;color:#FFE4A0;}
.splash-tagline{margin-top:6px;font-size:13px;color:rgba(255,255,255,0.55);letter-spacing:1px;}
.splash-dots{display:flex;gap:8px;margin-top:52px;}
.splash-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.25);animation:dotwave 1.5s ease-in-out infinite;}
.splash-dot:nth-child(1){animation-delay:0s;}
.splash-dot:nth-child(2){animation-delay:0.2s;}
.splash-dot:nth-child(3){animation-delay:0.4s;}
@keyframes dotwave{0%,60%,100%{background:rgba(255,255,255,0.25);transform:scale(1);}30%{background:rgba(255,228,160,0.9);transform:scale(1.3);}}

/* ── APP SHELL ── */
.app{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto;background:#F0EDFF;position:relative;}

/* ── HEADER ── */
.app-header{background:linear-gradient(135deg,#7B5EA7 0%,#9B6FD4 60%,#A87FDD 100%);padding:52px 20px 22px;flex-shrink:0;position:relative;overflow:hidden;}
.app-header::after{content:’’;position:absolute;bottom:-28px;left:0;right:0;height:56px;background:#F0EDFF;border-radius:28px 28px 0 0;}
.app-header-inner{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;}
.app-logo-pill{display:flex;align-items:center;gap:1px;}
.app-logo-text{font-size:22px;font-weight:300;color:rgba(255,255,255,0.85);letter-spacing:-0.3px;}
.app-logo-bold{font-size:22px;font-weight:800;color:#FFE4A0;letter-spacing:-0.3px;}
.app-year-chip{background:rgba(255,255,255,0.18);color:#FFF;padding:5px 14px;border-radius:100px;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,0.25);backdrop-filter:blur(8px);}

/* ── CONTENT ── */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px 16px;background:#F0EDFF;margin-bottom:72px;}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#FFFFFF;border-top:1px solid #EAE4F8;display:flex;z-index:200;padding:4px 0 max(8px,env(safe-area-inset-bottom));box-shadow:0 -4px 24px rgba(123,94,167,0.10);}
.bottom-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border:none;background:none;cursor:pointer;color:#B0A0CC;transition:color .15s;}
.bottom-nav-btn.active{color:#7B5EA7;}
.bottom-nav-icon{width:26px;height:26px;display:flex;align-items:center;justify-content:center;transition:transform .15s;}
.bottom-nav-btn.active .bottom-nav-icon{transform:scale(1.08);}
.bottom-nav-label{font-size:9.5px;font-weight:600;letter-spacing:0.2px;font-family:‘DM Sans’,sans-serif;}

/* ── SECTION PILLS (used as sub-headers) ── */
.section-pill{display:inline-flex;align-items:center;gap:6px;background:#EDE6F8;color:#7B5EA7;border-radius:100px;padding:5px 14px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;margin:16px 0 10px;}

/* ── CARDS ── */
.card{background:#FFFFFF;border-radius:24px;padding:20px;margin-bottom:12px;box-shadow:0 2px 12px rgba(123,94,167,0.08),0 1px 3px rgba(0,0,0,0.04);}
.card-sm{background:#FFFFFF;border-radius:20px;padding:16px;margin-bottom:10px;box-shadow:0 2px 10px rgba(123,94,167,0.07);}
.card-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.4px;color:#B0A0CC;margin-bottom:12px;}
.card-value{font-family:‘DM Sans’,sans-serif;font-size:26px;color:#1A1040;line-height:1;letter-spacing:-0.5px;font-weight:800;}
.card-sub{font-size:12px;color:#8878A8;margin-top:4px;}

/* ── HERO CARD ── */
.hero-card{background:linear-gradient(145deg,#7B5EA7 0%,#9B6FD4 55%,#A87FDD 100%);border-radius:28px;padding:24px;margin-bottom:12px;box-shadow:0 12px 40px rgba(123,94,167,0.35),0 4px 12px rgba(0,0,0,0.1);position:relative;overflow:hidden;}
.hero-card::before{content:’’;position:absolute;top:-40px;right:-30px;width:160px;height:160px;background:radial-gradient(circle,rgba(255,228,160,0.18) 0%,transparent 70%);pointer-events:none;}
.hero-card::after{content:’’;position:absolute;bottom:-30px;left:-20px;width:120px;height:120px;background:radial-gradient(circle,rgba(255,255,255,0.06) 0%,transparent 70%);pointer-events:none;}
.hero-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:rgba(255,228,160,0.7);margin-bottom:6px;}
.hero-value{font-family:‘DM Sans’,sans-serif;font-size:40px;color:#FFF;line-height:1;letter-spacing:-1.5px;font-weight:800;}
.hero-delta{font-size:12px;margin-top:6px;font-weight:600;}
.hero-delta.pos{color:#A0F0C0;}
.hero-delta.neg{color:#FFB0B0;}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
.hero-stat{background:rgba(255,255,255,0.13);border-radius:18px;padding:14px;border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(4px);}
.hero-stat-label{font-size:9px;color:rgba(255,228,160,0.65);font-weight:700;text-transform:uppercase;letter-spacing:1.2px;}
.hero-stat-value{font-size:18px;font-family:‘DM Sans’,sans-serif;color:#FFF;margin-top:4px;letter-spacing:-0.4px;font-weight:700;}
.hero-stat-sub{font-size:10px;color:rgba(255,255,255,0.35);margin-top:2px;}

/* ── PILL STATS ROW (2 or 3 col) ── */
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.stat-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
.stat-pill{border-radius:20px;padding:14px 12px;text-align:center;}
.stat-pill-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;opacity:0.7;margin-bottom:5px;}
.stat-pill-value{font-size:19px;font-weight:800;font-family:‘DM Sans’,sans-serif;letter-spacing:-0.4px;}
.stat-pill-sub{font-size:10px;margin-top:3px;opacity:0.65;}
/* Color variants */
.sp-purple{background:#F0EBFF;color:#6B4EA0;}
.sp-mint{background:#E6FBF3;color:#2A8A6A;}
.sp-coral{background:#FFF0EE;color:#C04040;}
.sp-gold{background:#FFF8E6;color:#A07020;}
.sp-blue{background:#EBF3FF;color:#3060A0;}
.sp-pink{background:#FFF0F8;color:#A04070;}

/* ── SUMMARY GRID (monthly) ── */
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.summary-box{background:#FFF;border-radius:20px;padding:15px;box-shadow:0 2px 10px rgba(123,94,167,0.07);}
.summary-box-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#B0A0CC;}
.summary-box-value{font-family:‘DM Sans’,sans-serif;font-size:20px;color:#1A1040;margin-top:5px;letter-spacing:-0.3px;font-weight:800;}
.summary-box-value.green{color:#2A8A6A;}
.summary-box-value.red{color:#C04040;}

/* ── GRIDS ── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

/* ── BAR CHART ── */
.bar-chart{display:flex;align-items:flex-end;gap:5px;height:72px;margin-top:10px;}

brackets=[[23200,.10],[71100,.12],[106750,.22],[182850,.24],[103550,.32],[243750,.35],[Infinity,.37]];
} else if(status===‘single’||status===‘mfs’){
brackets=[[11600,.10],[35550,.12],[53375,.22],[91950,.24],[51775,.32],[365625,.35],[Infinity,.37]];
} else { // hoh
brackets=[[16550,.10],[49150,.12],[63100,.22],[100500,.24],[56450,.32],[209400,.35],[Infinity,.37]];
}
let tax=0, remaining=Math.max(0,taxable);
for(const [size,rate] of brackets){
const chunk=Math.min(remaining,size);
tax+=chunk*rate;
remaining-=chunk;
if(remaining<=0) break;
}
return tax;
}
function standardDeduction(status){
return {mfj:29200,single:14600,mfs:14600,hoh:21900}[status]||29200;
}

),

function DonutChart({data,size=120}){
const canvasRef=useRef(null);
useEffect(()=>{
const canvas=canvasRef.current;
if(!canvas||!data||!data.length) return;
const ctx=canvas.getContext(‘2d’);
const dpr=window.devicePixelRatio||1;
canvas.width=size*dpr;
canvas.height=size*dpr;
ctx.scale(dpr,dpr);
const cx=size/2,cy=size/2,r=size/2-8,inner=r*0.62;
const total=data.reduce((s,d)=>s+(d.value||0),0)||1;
let angle=-Math.PI/2;
data.forEach(d=>{
const slice=(d.value/total)*Math.PI*2;
ctx.beginPath();
ctx.moveTo(cx,cy);
ctx.arc(cx,cy,r,angle,angle+slice);
ctx.closePath();
ctx.fillStyle=d.color;
ctx.fill();
angle+=slice;
});
// inner hole
ctx.beginPath();
ctx.arc(cx,cy,inner,0,Math.PI*2);
ctx.fillStyle=’#FFFFFF’;
ctx.fill();
},[data,size]);
return e(‘canvas’,{ref:canvasRef,className:‘donut-canvas’,style:{width:size,height:size}});
}

}

function InvestTab({data,setData}){
const [showForm,setShowForm]=useState(false);
const [editId,setEditId]=useState(null);
const [showQuickLog,setShowQuickLog]=useState(false);
const investments=data.investments||[];

const typeColors={‘Private Lending’:’#7B5EA7’,‘Real Estate’:’#3D7EAA’,‘Plot / Land’:’#B8926A’,‘Gold / Silver’:’#C8A840’,‘Stocks / ETF’:’#2A5C35’,‘Mutual Fund’:’#2A5C35’,‘Crypto’:’#C0392B’,‘Fixed Deposit’:’#3D7EAA’,‘Bonds’:’#6A5030’,‘Other’:’#9E8E60’};

// Max-concurrent for Private Lending
const lendingMaxConcurrent=(()=>{
const loans=investments.filter(i=>i.type===‘Private Lending’).map(i=>({
principal:+i.principalUSD||+i.amountUSD||0,
start:i.startDate?new Date(i.startDate).getTime():null,
end:i.maturityDate?new Date(i.maturityDate).getTime():null
}));
if(!loans.length) return 0;
const dated=loans.filter(l=>l.start!==null&&l.end!==null);
const undated=loans.filter(l=>l.start===null||l.end===null);
if(!dated.length) return loans.reduce((s,l)=>s+l.principal,0);
const pts=[…new Set(dated.flatMap(l=>[l.start,l.end]))].sort((a,b)=>a-b);
let mx=0;
for(let pi=0;pi<pts.length-1;pi++){
const mid=(pts[pi]+pts[pi+1])/2;
const c=dated.filter(l=>l.start<=mid&&l.end>mid).reduce((s,l)=>s+l.principal,0);
if(c>mx) mx=c;
}
const atLast=dated.filter(l=>l.start<=pts[pts.length-1]&&l.end>=pts[pts.length-1]).reduce((s,l)=>s+l.principal,0);
if(atLast>mx) mx=atLast;
return mx+undated.reduce((s,l)=>s+l.principal,0);
})();

const byType={};
investments.forEach(i=>{const t=i.type||‘Other’;byType[t]=(byType[t]||0)+(+i.amountUSD||0);});
if(byType[‘Private Lending’]) byType[‘Private Lending’]=lendingMaxConcurrent;
const totalUSD=Object.values(byType).reduce((s,v)=>s+v,0);

// Group investments by type
const typeOrder=[‘Private Lending’,‘Real Estate’,‘Plot / Land’,‘Gold / Silver’,‘Stocks / ETF’,‘Mutual Fund’,‘Crypto’,‘Fixed Deposit’,‘Bonds’,‘Other’];
const grouped={};
investments.forEach(i=>{const t=i.type||‘Other’;if(!grouped[t])grouped[t]=[];grouped[t].push(i);});

function handleDelete(id){
if(!confirm(‘Remove this investment?’)) return;
const nd={…data,investments:investments.filter(i=>i.id!==id)};
setData(nd);saveData(nd);showToast(‘Investment removed’);
}
function handleEdit(inv){setEditId(inv.id);setShowForm(true);}
function handleFormClose(){setShowForm(false);setEditId(null);}
function handleQuickSave(updated){
const nd={…data,investments:updated};
setData(nd);saveData(nd);
}

if(showForm) return e(InvestForm,{
data,setData,
existing:editId?investments.find(i=>i.id===editId):null,
onClose:handleFormClose
});

const hasLoggable=investments.some(i=>i.type===‘Private Lending’||i.type===‘Real Estate’);
const nowMs=Date.now();

return e(‘div’,null,
// Quick Log Sheet
showQuickLog&&e(QuickLogSheet,{investments,onClose:()=>setShowQuickLog(false),onSave:handleQuickSave}),

start:i.startDate?new Date(i.startDate).getTime():null,
end:i.maturityDate?new Date(i.maturityDate).getTime():null
}));
if(loans.length===0) return 0;
const dated=loans.filter(l=>l.start!==null&&l.end!==null);
const undated=loans.filter(l=>l.start===null||l.end===null);
if(dated.length===0) return loans.reduce((s,l)=>s+l.principal,0);
const points=[…new Set(dated.flatMap(l=>[l.start,l.end]))].sort((a,b)=>a-b);
let maxC=0;
for(let pi=0;pi<points.length-1;pi++){
const mid=(points[pi]+points[pi+1])/2;
const c=dated.filter(l=>l.start<=mid&&l.end>mid).reduce((s,l)=>s+l.principal,0);
if(c>maxC) maxC=c;
}
const atLast=dated.filter(l=>l.start<=points[points.length-1]&&l.end>=points[points.length-1]).reduce((s,l)=>s+l.principal,0);
if(atLast>maxC) maxC=atLast;
return maxC+undated.reduce((s,l)=>s+l.principal,0);
})();
